name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  EXPECTED_COUNT: 24221

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configure VMware GemFire commercial repository
        shell: bash
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
            <servers>
              <server>
                <id>gemfire-enterprise</id>
                <username>${{ secrets.GEMFIRE_REPO_USERNAME }}</username>
                <password>${{ secrets.GEMFIRE_REPO_PASSWORD }}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>gemfire</id>
                <activation>
                  <activeByDefault>true</activeByDefault>
                </activation>
                <repositories>
                  <repository>
                    <id>gemfire-enterprise</id>
                    <url>${{ secrets.GEMFIRE_REPO_URL }}</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>false</enabled>
                    </snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
          </settings>
          EOF

      - name: Build
        run: ./mvnw -q -DskipTests package

      - name: Start Postgres + GemFire cluster
        run: docker compose up -d --wait

      - name: Start the application
        run: |
          nohup java -jar target/retailstore-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for the application to be ready
        shell: bash
        run: |
          PORT=""
          for i in $(seq 1 60); do
            if [[ -z "$PORT" ]]; then
              PORT=$(grep -oE "Tomcat started on port [0-9]+" app.log | grep -oE "[0-9]+" | tail -1)
            fi
            if [[ -n "$PORT" ]] && curl -sf "http://localhost:${PORT}/actuator/health" | grep -q '"status":"UP"'; then
              echo "Application is UP on port ${PORT}"
              echo "${PORT}" > app.port
              exit 0
            fi
            sleep 5
          done
          echo "Application failed to become healthy"
          tail -100 app.log
          exit 1

      - name: Load and verify data
        shell: bash
        run: |
          set -e
          PORT=$(cat app.port)
          BASE_URL="http://localhost:${PORT}"
          echo "Using ${BASE_URL}"

          echo "Loading into GemFire..."
          curl -sf "${BASE_URL}/load-gemfire"
          GF_COUNT=$(curl -sf "${BASE_URL}/get-gemfire-count")
          echo "GemFire count: ${GF_COUNT}"
          test "${GF_COUNT}" = "${EXPECTED_COUNT}"

          echo "Loading into Postgres (batch)..."
          curl -sf "${BASE_URL}/load-jpa-batch"
          JPA_COUNT=$(curl -sf "${BASE_URL}/get-jpa-count")
          echo "JPA count: ${JPA_COUNT}"
          test "${JPA_COUNT}" = "${EXPECTED_COUNT}"

          echo "Single-record lookup..."
          curl -sf "${BASE_URL}/get-jpa-by-id/750931" | grep -q '"License_Number":"750931"'

          echo "Stats:"
          curl -sf "${BASE_URL}/stats"

      - name: Run tests
        run: ./mvnw -q test

      - name: Collect application log on failure
        if: failure()
        run: cat app.log || true
